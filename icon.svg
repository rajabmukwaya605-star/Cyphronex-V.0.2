<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#0a1945" />
    </linearGradient>
    <linearGradient id="vaneGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0051ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Hex Shield -->
  <rect width="512" height="512" rx="110" fill="#070c18" />
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="2" />
  
  <!-- Subtle cryptographic grid background -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f0ff" stroke-opacity="0.1" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0066ff" stroke-opacity="0.15" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#00f0ff" stroke-opacity="0.2" stroke-dasharray="4 6" />

  <!-- Background Core Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#coreGlow)" />

  <!-- Cyphron Vane Facet 1 (Left Wing) -->
  <path d="M 256 80 L 130 170 L 150 330 L 256 420 L 230 256 Z" 
        fill="url(#cyberGrad)" 
        stroke="#00f0ff" 
        stroke-width="3" 
        filter="url(#neonGlow)" />

  <!-- Cyphron Vane Facet 2 (Right Wing) -->
  <path d="M 256 80 L 382 170 L 362 330 L 256 420 L 282 256 Z" 
        fill="url(#vaneGrad)" 
        stroke="#38bdf8" 
        stroke-width="3" 
        filter="url(#neonGlow)" />

  <!-- Central Cipher Lock Core -->
  <polygon points="256,160 310,256 256,352 202,256" 
           fill="#070e24" 
           stroke="#00f0ff" 
           stroke-width="4" />

  <!-- Keyhole / Cryptographic Monolith -->
  <circle cx="256" cy="242" r="16" fill="#00f0ff" />
  <polygon points="250,248 262,248 268,280 244,280" fill="#00f0ff" />

  <!-- Laser nodes -->
  <circle cx="256" cy="80" r="7" fill="#00f0ff" filter="url(#neonGlow)" />
  <circle cx="130" cy="170" r="6" fill="#00f0ff" />
  <circle cx="382" cy="170" r="6" fill="#00f0ff" />
  <circle cx="256" cy="420" r="7" fill="#00f0ff" filter="url(#neonGlow)" />
</svg>
